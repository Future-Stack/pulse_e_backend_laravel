info:
  name: add-health-logs
  type: http
  seq: 1
  tags:
    - User-Health Log

http:
  method: POST
  url: "{{baseUrl}}/api/v1/health-logs"
  body:
    type: json
    data: |-
      {
        "log_date": "2026-07-14",
        "mood": "😊",
        "energy_level": "High",
        "symptoms": [
          "Headache",
          "Fatigue"
        ],
        "notes": "Feeling much better today."
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful response
    request:
      url: "{{baseUrl}}/api/v1/health-logs"
      method: POST
      body:
        type: json
        data: |-
          {
            "log_date": "2026-07-14",
            "mood": "😊",
            "energy_level": "High",
            "symptoms": [
              "Headache",
              "Fatigue"
            ],
            "notes": "Feeling much better today."
          }
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
