    description: Successful response
    request:
      url: "{{baseUrl}}/api/v1/users/update-status"
      method: POST
      body:
        type: json
        data: |-
          {
            "user_id": 3,
            "status": "suspended"
          }
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
