info:
  name: create-post
  type: http
  seq: 1
  tags:
    - Community Post

http:
  method: POST
  url: "{{base_url}}/posts"
  body:
    type: json
    data: |-
      {
        "life_journey_id": [
          1,
          4
        ],
        "title": "How I raised my Vitamin D in 3 weeks",
        "content": "Started at 19 ng/mL, retested after 8 weeks...",
        "is_anonymous": false,
        "tags": [
          "vitamin-c",
          "progress"
        ]
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful response
    request:
      url: "{{baseUrl}}/api/v1/posts"
      method: POST
      body:
        type: json
        data: |-
          {
            "life_journey_id": [
              1,
              4
            ],
            "title": "How I raised my Vitamin D in 3 weeks",
            "content": "Started at 19 ng/mL, retested after 8 weeks...",
            "is_anonymous": false,
            "tags": [
              "vitamin-c",
              "progress"
            ]
          }
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
