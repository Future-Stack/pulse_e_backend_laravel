info:
  name: change-password
  type: http
  seq: 7
  tags:
    - Auth

http:
  method: POST
  url: "{{baseUrl}}/api/v1/change-password"
  body:
    type: json
    data: |-
      {
        "current_password": "NewPassword@123",
        "new_password": "Password@1234",
        "new_password_confirmation": "Password@1234"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful response
    request:
      url: "{{baseUrl}}/api/v1/change-password"
      method: POST
      body:
        type: json
        data: |-
          {
            "current_password": "NewPassword@123",
            "new_password": "Password@1234",
            "new_password_confirmation": "Password@1234"
          }
