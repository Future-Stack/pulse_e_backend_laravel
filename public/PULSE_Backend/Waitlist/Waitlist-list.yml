info:
  name: Waitlist-list
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/waitlist/list?filter=confirmed"
  params:
    - name: filter
      value: confirmed
      type: query
      description: pending_confirmation, confirmed, invited, activated
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
