services:
  # Laravel Application Service: The main PHP application
  app:
    image: softvence/pulse_backend_laravel:latest
    platform: linux/amd64
    container_name: laravel_app
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
    networks:
      - laravel

  # Laravel Primary Queue Worker: Processes default & NPPES background jobs
  queue:
    image: softvence/pulse_backend_laravel:latest
    platform: linux/amd64
    container_name: laravel_queue
    restart: unless-stopped
    command: php artisan queue:work --verbose --tries=3 --timeout=3600 --memory=512M
    env_file:
      - .env
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - laravel

  # Laravel Marketplace Queue Worker: Dedicated worker for marketplace discovery & ingestion
  queue_marketplace:
    image: softvence/pulse_backend_laravel:latest
    platform: linux/amd64
    container_name: laravel_queue_marketplace
    restart: unless-stopped
    command: php artisan queue:work --queue=default,high,marketplace --verbose --tries=3 --timeout=3600 --memory=512M
    env_file:
      - .env
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - laravel

  # Laravel Scheduler Service: Triggers scheduled console commands and periodic background jobs
  scheduler:
    image: softvence/pulse_backend_laravel:latest
    platform: linux/amd64
    container_name: laravel_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: >
      sh -c "while true; do php artisan schedule:run; sleep 60; done"
    env_file:
      - .env
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - laravel

  # Redis Cache & In-Memory Store
  redis:
    image: redis:7-alpine
    container_name: laravel_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - laravel

networks:
  laravel:
    driver: bridge
